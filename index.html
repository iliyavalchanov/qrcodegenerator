<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beautiful QR Codes</title>

    <meta name="description" content="Free QR code generator with six module styles and an optional centre logo. No account, nothing stored, PNG download." />
    <meta name="author" content="Iliya Valchanov" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://qr.iliya.ai/" />

    <meta property="og:title" content="Beautiful QR Codes" />
    <meta property="og:description" content="Free QR code generator with six module styles and an optional centre logo. No account, nothing stored." />
    <meta property="og:image" content="https://qr.iliya.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://qr.iliya.ai/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beautiful QR Codes" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beautiful QR Codes" />
    <meta name="twitter:description" content="Free QR code generator with six module styles and an optional centre logo." />
    <meta name="twitter:image" content="https://qr.iliya.ai/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23141414'/%3E%3Crect x='24' y='24' width='52' height='52' fill='none' stroke='%23f4f1ea' stroke-width='11'/%3E%3Crect x='41' y='41' width='18' height='18' fill='%23f4f1ea'/%3E%3C/svg%3E" />

    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Beautiful QR Codes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Spectral:wght@400;600&display=swap" rel="stylesheet" />

    <style>
      :root {
        --paper: #f4f1ea;
        --surface: #fbfaf7;
        --ink: #141414;
        --ink-muted: #6b6860;
        --hairline: #d9d5cc;
        --hairline-strong: #b8b3a8;
        --qr-card: #ffffff;
        --danger: #b3261e;
        --serif: 'Spectral', Georgia, 'Times New Roman', serif;
        --display: 'Lora', Georgia, 'Times New Roman', serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #121211;
          --surface: #1a1918;
          --ink: #ece9e1;
          --ink-muted: #8f8b82;
          --hairline: #2c2b28;
          --hairline-strong: #45433e;
          --qr-card: #ffffff;
          --danger: #f2a49e;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
      }

      body {
        font-family: var(--serif);
        font-size: 16px;
        line-height: 1.5;
        background: var(--paper);
        color: var(--ink);
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .label {
        font-family: var(--serif);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }

      /* Layout */
      .page {
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 24px;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        padding: 28px 0 20px;
        border-bottom: 1px solid var(--hairline);
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--display);
        font-weight: 600;
        font-size: 18px;
        letter-spacing: -0.01em;
        color: var(--ink);
        text-decoration: none;
      }

      .wordmark svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      .main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        flex: 1;
      }

      .col {
        padding: 32px 0;
      }

      .col-form {
        padding-right: 40px;
      }

      .col-preview {
        padding-left: 40px;
        border-left: 1px solid var(--hairline);
      }

      .col-title {
        margin-bottom: 20px;
      }

      /* Fields */
      .field {
        margin-bottom: 22px;
      }

      .field-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .input {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid var(--hairline-strong);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 14px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .input::placeholder {
        color: var(--ink-muted);
      }

      .input:focus {
        outline: none;
        border-color: var(--ink);
        box-shadow: 0 0 0 3px var(--hairline);
      }

      /* Upload */
      .upload-row {
        display: flex;
        gap: 8px;
      }

      .upload {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 14px;
        border: 1px solid var(--hairline-strong);
        border-radius: 6px;
        background: var(--surface);
        cursor: pointer;
        min-width: 0;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .upload:hover {
        border-color: var(--ink);
      }

      .upload:focus-within {
        border-color: var(--ink);
        box-shadow: 0 0 0 3px var(--hairline);
      }

      .upload input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        overflow: hidden;
      }

      .upload svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: var(--ink-muted);
      }

      .upload-text {
        font-size: 15px;
        color: var(--ink-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .upload.has-file .upload-text {
        color: var(--ink);
        font-family: var(--mono);
        font-size: 13px;
      }

      .upload.has-file svg {
        color: var(--ink);
      }

      .upload-clear {
        display: none;
        height: 44px;
        padding: 0 14px;
        border: 1px solid var(--hairline-strong);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink-muted);
        font-family: var(--serif);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .upload-clear:hover {
        color: var(--ink);
        border-color: var(--ink);
      }

      .upload-row.has-file .upload-clear {
        display: block;
      }

      /* Style picker */
      .style-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .style-tile {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px 8px 12px;
        border: 1px solid var(--hairline-strong);
        border-radius: 6px;
        background: var(--surface);
        cursor: pointer;
        color: var(--ink);
        transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      }

      .style-tile input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .style-tile svg {
        width: 36px;
        height: 36px;
      }

      .style-tile span {
        font-family: var(--serif);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .style-tile:hover {
        border-color: var(--ink);
      }

      .style-tile:has(input:checked) {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
      }

      .style-tile:has(input:focus-visible) {
        box-shadow: 0 0 0 3px var(--hairline);
      }

      /* Buttons */
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 28px;
      }

      .btn {
        height: 44px;
        padding: 0 20px;
        border-radius: 6px;
        border: 1px solid transparent;
        font-family: var(--display);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s ease, border-color 0.15s ease;
      }

      .btn-primary {
        flex: 1;
        background: var(--ink);
        color: var(--paper);
      }

      .btn-primary:hover {
        opacity: 0.85;
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .btn-ghost {
        background: transparent;
        color: var(--ink-muted);
        border-color: var(--hairline-strong);
      }

      .btn-ghost:hover {
        color: var(--ink);
        border-color: var(--ink);
      }

      .btn-block {
        width: 100%;
        margin-top: 16px;
      }

      .error {
        margin-top: 12px;
        font-size: 13px;
        color: var(--danger);
      }

      .error[hidden] {
        display: none;
      }

      /* Preview */
      .preview {
        position: relative;
        aspect-ratio: 1;
        max-width: 440px;
        border: 1px solid var(--hairline);
        border-radius: 6px;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .preview-idle,
      .preview-loading,
      .preview-done {
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        text-align: center;
        width: 100%;
        height: 100%;
      }

      .preview[data-state='idle'] .preview-idle,
      .preview[data-state='loading'] .preview-loading,
      .preview[data-state='done'] .preview-done {
        display: flex;
      }

      .preview-idle svg {
        width: 56px;
        height: 56px;
        color: var(--hairline-strong);
      }

      .preview-idle p {
        font-size: 13px;
        color: var(--ink-muted);
        max-width: 220px;
      }

      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid var(--hairline-strong);
        border-top-color: var(--ink);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .preview-done img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--qr-card);
        border-radius: 4px;
      }

      .preview-meta {
        margin-top: 12px;
        display: flex;
        justify-content: space-between;
        max-width: 440px;
      }

      .preview-actions {
        max-width: 440px;
      }

      /* Drag overlay */
      .drag-overlay {
        position: fixed;
        inset: 0;
        background: var(--paper);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        pointer-events: none;
      }

      .drag-overlay.active {
        display: flex;
      }

      .drag-message {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 40px 56px;
        border: 1px solid var(--ink);
        border-radius: 6px;
        font-size: 15px;
        font-weight: 500;
      }

      .drag-message svg {
        width: 24px;
        height: 24px;
      }

      /* Footer */
      .footer {
        display: flex;
        justify-content: space-between;
        padding: 20px 0 28px;
        border-top: 1px solid var(--hairline);
      }

      .footer a {
        color: inherit;
        text-decoration: none;
      }

      .footer a:hover {
        color: var(--ink);
      }

      @media (max-width: 768px) {
        .page {
          padding: 0 16px;
        }

        .header {
          padding: 20px 0 16px;
        }

        .header .label {
          display: none;
        }

        .main {
          grid-template-columns: 1fr;
        }

        .col {
          padding: 24px 0;
        }

        .col-form {
          padding-right: 0;
        }

        .col-preview {
          padding-left: 0;
          border-left: 0;
          border-top: 1px solid var(--hairline);
        }

        .input {
          font-size: 16px; /* Prevent zoom on iOS */
        }

        .preview,
        .preview-meta,
        .preview-actions {
          max-width: none;
        }

        .footer {
          flex-direction: column;
          gap: 6px;
        }
      }
    </style>
  </head>
  <body>
    <div class="drag-overlay" id="dragOverlay">
      <div class="drag-message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <div>Drop the logo anywhere</div>
      </div>
    </div>

    <div class="page">
      <header class="header">
        <a class="wordmark" href="/">
          <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="currentColor"/><rect x="24" y="24" width="52" height="52" fill="none" stroke="var(--paper)" stroke-width="11"/><rect x="41" y="41" width="18" height="18" fill="var(--paper)"/></svg>
          Beautiful QR Codes
        </a>
        <div class="label">Free · No account · Nothing stored</div>
      </header>

      <main class="main">
        <section class="col col-form">
          <div class="col-title label">01 / Input</div>

          <form id="qrForm" novalidate>
            <div class="field">
              <div class="field-label">
                <label class="label" for="url">URL or text</label>
                <span class="label">Required</span>
              </div>
              <input class="input" type="text" id="url" name="url" placeholder="https://" autocomplete="off" spellcheck="false" required />
            </div>

            <div class="field">
              <div class="field-label">
                <label class="label" for="logo">Centre logo</label>
                <span class="label">Optional</span>
              </div>
              <div class="upload-row" id="uploadRow">
                <label class="upload" id="uploadLabel">
                  <input type="file" id="logo" name="logo" accept="image/*" />
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
                  <span class="upload-text" id="uploadText">Choose an image, or drop it anywhere</span>
                </label>
                <button type="button" class="upload-clear" id="uploadClear">Remove</button>
              </div>
            </div>

            <div class="field">
              <div class="field-label">
                <span class="label">Module style</span>
              </div>
              <div class="style-grid" role="radiogroup" aria-label="Module style">
                <label class="style-tile">
                  <input type="radio" name="style" value="circle" checked />
                  <svg viewBox="0 0 36 36" fill="currentColor" aria-hidden="true"><circle cx="4.5" cy="4.5" r="4"/><circle cx="13.5" cy="4.5" r="4"/><circle cx="31.5" cy="4.5" r="4"/><circle cx="4.5" cy="13.5" r="4"/><circle cx="22.5" cy="13.5" r="4"/><circle cx="31.5" cy="13.5" r="4"/><circle cx="13.5" cy="22.5" r="4"/><circle cx="22.5" cy="22.5" r="4"/><circle cx="4.5" cy="31.5" r="4"/><circle cx="13.5" cy="31.5" r="4"/><circle cx="31.5" cy="31.5" r="4"/></svg>
                  <span>Dots</span>
                </label>
                <label class="style-tile">
                  <input type="radio" name="style" value="square" />
                  <svg viewBox="0 0 36 36" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="18" height="9"/><rect x="27" y="0" width="9" height="9"/><rect x="0" y="9" width="9" height="9"/><rect x="18" y="9" width="18" height="9"/><rect x="9" y="18" width="18" height="9"/><rect x="0" y="27" width="18" height="9"/><rect x="27" y="27" width="9" height="9"/></svg>
                  <span>Squares</span>
                </label>
                <label class="style-tile">
                  <input type="radio" name="style" value="gapped_square" />
                  <svg viewBox="0 0 36 36" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="7" height="7"/><rect x="10" y="1" width="7" height="7"/><rect x="28" y="1" width="7" height="7"/><rect x="1" y="10" width="7" height="7"/><rect x="19" y="10" width="7" height="7"/><rect x="28" y="10" width="7" height="7"/><rect x="10" y="19" width="7" height="7"/><rect x="19" y="19" width="7" height="7"/><rect x="1" y="28" width="7" height="7"/><rect x="10" y="28" width="7" height="7"/><rect x="28" y="28" width="7" height="7"/></svg>
                  <span>Gapped</span>
                </label>
                <label class="style-tile">
                  <input type="radio" name="style" value="rounded" />
                  <svg viewBox="0 0 36 36" fill="currentColor" aria-hidden="true"><path d="M3 0h12a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H9v6a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3z"/><rect x="27" y="0" width="9" height="9" rx="3"/><path d="M21 9h12a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3h-6v6a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3v-3a3 3 0 0 1 3-3h6v-6a3 3 0 0 1 3-3z"/><rect x="0" y="27" width="18" height="9" rx="3"/><rect x="27" y="27" width="9" height="9" rx="3"/></svg>
                  <span>Rounded</span>
                </label>
                <label class="style-tile">
                  <input type="radio" name="style" value="vertical_bars" />
                  <svg viewBox="0 0 36 36" fill="currentColor" aria-hidden="true"><rect x="1" y="0" width="7" height="18" rx="3.5"/><rect x="1" y="27" width="7" height="9" rx="3.5"/><rect x="10" y="0" width="7" height="9" rx="3.5"/><rect x="10" y="18" width="7" height="18" rx="3.5"/><rect x="19" y="9" width="7" height="18" rx="3.5"/><rect x="28" y="0" width="7" height="18" rx="3.5"/><rect x="28" y="27" width="7" height="9" rx="3.5"/></svg>
                  <span>Vertical</span>
                </label>
                <label class="style-tile">
                  <input type="radio" name="style" value="horizontal_bars" />
                  <svg viewBox="0 0 36 36" fill="currentColor" aria-hidden="true"><rect x="0" y="1" width="18" height="7" rx="3.5"/><rect x="27" y="1" width="9" height="7" rx="3.5"/><rect x="0" y="10" width="9" height="7" rx="3.5"/><rect x="18" y="10" width="18" height="7" rx="3.5"/><rect x="9" y="19" width="18" height="7" rx="3.5"/><rect x="0" y="28" width="18" height="7" rx="3.5"/><rect x="27" y="28" width="9" height="7" rx="3.5"/></svg>
                  <span>Horizontal</span>
                </label>
              </div>
            </div>

            <div class="actions">
              <button type="submit" class="btn btn-primary" id="generateBtn">Generate</button>
              <button type="button" class="btn btn-ghost" onclick="clearForm()">Clear</button>
            </div>
            <p class="error" id="error" hidden></p>
          </form>
        </section>

        <section class="col col-preview">
          <div class="col-title label">02 / Output</div>

          <div class="preview" id="previewArea" data-state="idle">
            <div class="preview-idle">
              <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="18" height="18"/><rect x="10" y="10" width="6" height="6" fill="currentColor" stroke="none"/><rect x="34" y="4" width="18" height="18"/><rect x="40" y="10" width="6" height="6" fill="currentColor" stroke="none"/><rect x="4" y="34" width="18" height="18"/><rect x="10" y="40" width="6" height="6" fill="currentColor" stroke="none"/><path d="M34 34h6v6h-6zM46 34h6v6h-6zM40 40h6v6h-6zM34 46h6v6h-6zM46 46h6v6h-6z" fill="currentColor" stroke="none"/></svg>
              <p>Your code appears here once generated.</p>
            </div>
            <div class="preview-loading">
              <div class="spinner"></div>
              <span class="label">Generating</span>
            </div>
            <div class="preview-done">
              <img id="previewImage" alt="Generated QR code" />
            </div>
          </div>

          <div class="preview-meta">
            <span class="label">PNG · Error correction H</span>
            <span class="label" id="previewStyle">Dots</span>
          </div>

          <div class="preview-actions">
            <button id="downloadBtn" class="btn btn-primary btn-block" style="display: none" onclick="downloadQR()">Download PNG</button>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span class="label">Codes are generated on request and never saved</span>
        <a class="label" href="https://iliya.ai">iliya.ai</a>
      </footer>
    </div>

    <script>
      let currentQRImage = null
      let dragCounter = 0

      const previewArea = document.getElementById('previewArea')
      const previewImage = document.getElementById('previewImage')
      const downloadBtn = document.getElementById('downloadBtn')
      const generateBtn = document.getElementById('generateBtn')
      const errorEl = document.getElementById('error')
      const logoInput = document.getElementById('logo')
      const uploadRow = document.getElementById('uploadRow')
      const uploadLabel = document.getElementById('uploadLabel')
      const uploadText = document.getElementById('uploadText')
      const uploadDefaultText = uploadText.textContent

      const STYLE_LABELS = {
        circle: 'Dots',
        square: 'Squares',
        gapped_square: 'Gapped',
        rounded: 'Rounded',
        vertical_bars: 'Vertical',
        horizontal_bars: 'Horizontal',
      }

      function isMobile() {
        return window.innerWidth <= 768
      }

      function scrollToOnMobile(el, block) {
        if (!isMobile()) return
        setTimeout(() => {
          el.scrollIntoView({ behavior: 'smooth', block: block, inline: 'nearest' })
        }, 100)
      }

      function showError(message) {
        errorEl.textContent = message
        errorEl.hidden = false
        scrollToOnMobile(document.getElementById('url'), 'start')
      }

      function clearError() {
        errorEl.hidden = true
        errorEl.textContent = ''
      }

      function selectedStyle() {
        return document.querySelector('input[name="style"]:checked').value
      }

      // Keep the output meta in sync with the picker
      document.querySelectorAll('input[name="style"]').forEach((input) => {
        input.addEventListener('change', () => {
          document.getElementById('previewStyle').textContent = STYLE_LABELS[input.value]
        })
      })

      // Drag and drop
      document.addEventListener('dragenter', function (e) {
        e.preventDefault()
        dragCounter++
        document.getElementById('dragOverlay').classList.add('active')
      })

      document.addEventListener('dragleave', function (e) {
        e.preventDefault()
        dragCounter--
        if (dragCounter === 0) {
          document.getElementById('dragOverlay').classList.remove('active')
        }
      })

      document.addEventListener('dragover', function (e) {
        e.preventDefault()
      })

      document.addEventListener('drop', function (e) {
        e.preventDefault()
        dragCounter = 0
        document.getElementById('dragOverlay').classList.remove('active')

        const files = e.dataTransfer.files
        if (files.length > 0) {
          const file = files[0]
          if (file.type.startsWith('image/')) {
            const dataTransfer = new DataTransfer()
            dataTransfer.items.add(file)
            logoInput.files = dataTransfer.files
            logoInput.dispatchEvent(new Event('change', { bubbles: true }))
          } else {
            showError('That file is not an image. PNG, JPG or SVG work.')
          }
        }
      })

      document.getElementById('qrForm').addEventListener('submit', async function (e) {
        e.preventDefault()
        clearError()

        const url = document.getElementById('url').value.trim()
        const logoFile = logoInput.files[0]
        const style = selectedStyle()

        if (!url) {
          showError('Enter a URL or some text first.')
          return
        }

        previewArea.dataset.state = 'loading'
        downloadBtn.style.display = 'none'
        generateBtn.disabled = true
        scrollToOnMobile(previewArea, 'center')

        try {
          let logoData = null
          if (logoFile) {
            logoData = await fileToBase64(logoFile)
          }

          const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url, logo: logoData, style: style }),
          })

          const result = await response.json()

          if (result.success) {
            currentQRImage = result.image
            showPreview(result.image)
          } else {
            previewArea.dataset.state = currentQRImage ? 'done' : 'idle'
            showError(result.error || 'Could not generate the code. Try again.')
          }
        } catch (error) {
          previewArea.dataset.state = currentQRImage ? 'done' : 'idle'
          showError(error.message)
        } finally {
          generateBtn.disabled = false
        }
      })

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader()
          reader.readAsDataURL(file)
          reader.onload = () => resolve(reader.result)
          reader.onerror = (error) => reject(error)
        })
      }

      function showPreview(imageData) {
        previewImage.src = imageData
        previewArea.dataset.state = 'done'
        downloadBtn.style.display = 'block'
        scrollToOnMobile(previewArea, 'start')
      }

      function downloadQR() {
        if (currentQRImage) {
          const url = document.getElementById('url').value
          const cleanUrl = url.replace(/^https?:\/\//, '').replace(/[^a-zA-Z0-9.-]/g, '_')
          const filename = `qrcode-${cleanUrl}.png`

          const link = document.createElement('a')
          link.download = filename
          link.href = currentQRImage
          link.click()
        }
      }

      function clearLogo() {
        logoInput.value = ''
        logoInput.dispatchEvent(new Event('change', { bubbles: true }))
      }

      function clearForm() {
        document.getElementById('qrForm').reset()
        clearError()
        clearLogo()
        document.querySelector('input[name="style"][value="circle"]').checked = true
        document.getElementById('previewStyle').textContent = STYLE_LABELS.circle
        previewImage.removeAttribute('src')
        previewArea.dataset.state = 'idle'
        downloadBtn.style.display = 'none'
        currentQRImage = null
        scrollToOnMobile(document.getElementById('url'), 'start')
      }

      document.getElementById('uploadClear').addEventListener('click', clearLogo)

      logoInput.addEventListener('change', function (e) {
        if (e.target.files.length > 0) {
          uploadText.textContent = e.target.files[0].name
          uploadLabel.classList.add('has-file')
          uploadRow.classList.add('has-file')
        } else {
          uploadText.textContent = uploadDefaultText
          uploadLabel.classList.remove('has-file')
          uploadRow.classList.remove('has-file')
        }
      })
    </script>
  </body>
</html>
